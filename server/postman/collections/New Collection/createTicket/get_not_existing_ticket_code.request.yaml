$kind: http-request
url: "{{urlbase}}:{{port}}/tickets/S9999999"
method: GET
scripts:
  - type: afterResponse
    code: |+
      pm.test("Successful request", function(){
          pm.response.to.have.status(404)
      })

      pm.test("Valid Content in HTML", function(){
          text = pm.response.text()
          pm.expect(text).to.include("<html>")
          pm.expect(text).to.not.match(/<div class="code">[SAD]\d+/)
      })

    language: text/javascript
order: 4495462800889140
